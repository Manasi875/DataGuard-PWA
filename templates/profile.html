<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <title>
        DataGuard | Profile
    </title>

</head>


<body>

<div class="app-layout">


<aside
    class="sidebar"
    id="sidebar"
>

<div class="sidebar-brand">

<div class="brand-mark">
    DG
</div>

<div>

<strong>
    DataGuard
</strong>

<span>
    Quality Admin
</span>

</div>

</div>


<nav>

<a
    class="nav-item"
    href="{{ url_for('dashboard') }}"
>

<span>
    ⌂
</span>

Dashboard

</a>


<a
    class="nav-item"
    href="{{ url_for('datasets') }}"
>

<span>
    ▤
</span>

Datasets

</a>


<a
    class="nav-item active"
    href="{{ url_for('profile') }}"
>

<span>
    ◉
</span>

Profile

</a>

</nav>


<div class="sidebar-bottom">

<div class="mini-user">

<div class="avatar">
    {{ session['username'][0]|upper }}
</div>

<div>

<strong>
    {{ session['username'] }}
</strong>

<span>
    Administrator
</span>

</div>

</div>


<a
    class="nav-item logout"
    href="{{ url_for('logout') }}"
>

<span>
    ↪
</span>

Logout

</a>

</div>

</aside>


<main class="main-content">


<header class="topbar">

<button
    class="mobile-menu"
    onclick="toggleSidebar()"
>
    ☰
</button>


<div>

<p class="eyebrow">
    ACCOUNT
</p>

<h1>
    Profile
</h1>

</div>

</header>


<section class="profile-card">


<div class="large-avatar">

    {{ user['username'][0]|upper }}

</div>


<div>

<p class="eyebrow">
    ADMINISTRATOR
</p>


<h2>
    {{ user['username'] }}
</h2>


<p class="muted">
    {{ user['email'] }}
</p>


<p class="muted">
    Member since {{ user['created_at'][:10] }}
</p>

</div>


</section>


</main>

</div>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>

</body>

</html>
